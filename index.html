html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);background:#bfe6ff;touch-action:manipulation;overscroll-behavior:none}
body{font-size:20px}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
img{-webkit-user-drag:none;user-drag:none}

.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(14px + var(--safe-t)) 16px calc(16px + var(--safe-b));
  background:linear-gradient(180deg,#8fd6ff 0%,#c9f0ff 55%,#fff6c9 100%)}
.screen.active{display:flex;animation:entra .35s ease-out}
@keyframes entra{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

/* Pulsanti grandi, a misura di dito */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;min-width:56px;padding:12px 26px;
  font-size:1.35rem;font-weight:900;letter-spacing:.3px;border-radius:999px;border:4px solid var(--blu-sc);
  background:var(--giallo);color:var(--ink);box-shadow:0 7px 0 var(--giallo-sc),0 12px 18px rgba(0,0,0,.18);
  transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--giallo-sc),0 4px 8px rgba(0,0,0,.18)}
.btn.blu{background:var(--blu);color:#fff;border-color:var(--blu-sc);box-shadow:0 7px 0 var(--blu-sc),0 12px 18px rgba(0,0,0,.18)}
.btn.rosso{background:var(--rosso);color:#fff;border-color:var(--rosso-sc);box-shadow:0 7px 0 var(--rosso-sc),0 12px 18px rgba(0,0,0,.18)}
.btn.verde{background:var(--verde);color:#fff;border-color:var(--verde-sc);box-shadow:0 7px 0 var(--verde-sc),0 12px 18px rgba(0,0,0,.18)}
.btn.grande{font-size:2rem;padding:20px 40px;min-height:88px}
.btn.piccolo{font-size:1.1rem;padding:8px 18px;min-height:48px;box-shadow:0 5px 0 var(--giallo-sc)}
.btn.blu.piccolo{box-shadow:0 5px 0 var(--blu-sc)}
.btn.tondo{width:56px;padding:0;font-size:1.6rem}
.btn[disabled]{filter:grayscale(.7);opacity:.7}

.barra{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex:0 0 auto}
.barra h2{margin:0;font-size:1.7rem;font-weight:900;text-shadow:0 2px 0 #fff;text-align:center;flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--blu);border-radius:999px;padding:6px 14px;font-weight:900;font-size:1.05rem;min-height:48px}

/* Uscite (energia) */
.energia{display:inline-flex;align-items:center;gap:6px}
.ball{width:28px;height:28px;border-radius:50%;border:3px solid var(--ink);flex:0 0 auto;
  background:linear-gradient(180deg,var(--rosso) 0 44%,var(--ink) 44% 56%,#fff 56% 100%);position:relative;transition:transform .3s}
.ball::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.ball.vuota{filter:grayscale(1) opacity(.35)}

/* =========================================================
   HOME
   ========================================================= */
#home{align-items:center;justify-content:center;text-align:center;gap:16px;
  background:radial-gradient(circle at 50% 0,#fff7b0 0,transparent 45%),linear-gradient(180deg,#58b8ff 0%,#9fe0ff 50%,#c9f5a8 100%)}
.titolo{margin:0;font-size:clamp(2.3rem,7vw,4.6rem);line-height:1.02;font-weight:1000;color:var(--giallo);
  -webkit-text-stroke:3px var(--blu);paint-order:stroke fill;text-shadow:0 6px 0 var(--blu-sc),0 12px 22px rgba(0,0,0,.25);
  animation:fluttua 3s ease-in-out infinite;padding:0 8px}
.titolo small{display:block;font-size:.42em;color:#fff;-webkit-text-stroke:2px var(--blu);margin-top:8px;letter-spacing:1px}
@keyframes fluttua{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.home-ball{width:96px;height:96px;border-radius:50%;border:6px solid var(--ink);position:relative;
  background:linear-gradient(180deg,var(--rosso) 0 42%,var(--ink) 42% 58%,#fff 58% 100%);
  box-shadow:inset -8px -8px 0 rgba(0,0,0,.12),0 12px 20px rgba(0,0,0,.25);animation:rotola 4s ease-in-out infinite}
.home-ball::after{content:"";position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px;border-radius:50%;background:#fff;border:6px solid var(--ink)}
@keyframes rotola{0%,100%{transform:rotate(-12deg) translateX(-12px)}50%{transform:rotate(12deg) translateX(12px)}}
.progresso{width:min(560px,92%);background:#fff;border:4px solid var(--blu);border-radius:26px;padding:14px 20px;box-shadow:0 8px 0 var(--blu-sc)}
.progresso .testo{font-size:1.5rem;font-weight:900}
.progresso .rango{font-size:1.05rem;font-weight:800;color:var(--blu);margin-top:2px}
.barra-prog{height:22px;border-radius:99px;background:#dfe6ff;margin-top:10px;overflow:hidden;border:3px solid var(--blu)}
.barra-prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--giallo) 0 14px,#ffe46b 14px 28px);transition:width .8s cubic-bezier(.2,.9,.3,1.2);animation:scorrevole 1.2s linear infinite;background-size:40px 40px}
@keyframes scorrevole{to{background-position:40px 0}}
.home-bottoni{display:flex;flex-direction:column;gap:18px;align-items:center;width:100%}
.home-extra{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.home-fondo{position:absolute;left:0;right:0;bottom:0;height:70px;pointer-events:none;
  background:radial-gradient(60px 40px at 10% 100%,#6fcf5c 98%,transparent) ,radial-gradient(90px 50px at 40% 100%,#58bd4a 98%,transparent),radial-gradient(70px 44px at 75% 100%,#6fcf5c 98%,transparent),radial-gradient(60px 36px at 95% 100%,#58bd4a 98%,transparent)}

/* =========================================================
   MAPPA
   ========================================================= */
#mappa{align-items:center}
.mappa-box{position:relative;width:min(100%,calc((100dvh - 190px) * 1.33));max-width:1000px;aspect-ratio:4/3;border-radius:34px;border:6px solid #fff;
  box-shadow:0 10px 0 var(--blu-sc),0 18px 30px rgba(0,0,0,.25);overflow:hidden;flex:0 0 auto;
  background:radial-gradient(ellipse 34% 26% at 50% 104%,#35b4f2 0 98%,transparent 100%),
    radial-gradient(ellipse 30% 22% at 88% 28%,#c8b69a 0 98%,transparent 100%),
    radial-gradient(ellipse 28% 30% at 15% 30%,#4fb85a 0 98%,transparent 100%),
    linear-gradient(180deg,#a8e6ff 0,#d2f5c2 35%,#8bd86d 100%)}
.mappa-path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mappa-path polyline{fill:none;stroke:#fff;stroke-width:1.4;stroke-dasharray:2.4 2.4;stroke-linecap:round;opacity:.85;animation:formiche 6s linear infinite}
@keyframes formiche{to{stroke-dashoffset:-30}}
.nuvola{position:absolute;font-size:3rem;opacity:.9;animation:nuvola 40s linear infinite;pointer-events:none;top:3%}
.nuvola.b{top:48%;font-size:2.2rem;animation-duration:55s;animation-delay:-20s}
@keyframes nuvola{from{transform:translateX(-120px)}to{transform:translateX(calc(min(100vw,1000px) + 40px))}}
.luogo{position:absolute;width:29%;aspect-ratio:1/.92;transform:translate(-50%,-50%);border-radius:30px;border:5px solid #fff;padding:0;overflow:hidden;
  box-shadow:0 8px 0 rgba(0,0,0,.28),0 14px 18px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .12s;min-width:100px;min-height:96px}
.luogo:active{transform:translate(-50%,-46%) scale(.96)}
.luogo .emj{font-size:clamp(2rem,6.2vw,3.8rem);filter:drop-shadow(0 4px 0 rgba(0,0,0,.2));position:relative;z-index:2;animation:salta 2.6s ease-in-out infinite}
@keyframes salta{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.luogo .lbl{position:absolute;left:0;right:0;bottom:0;z-index:3;background:rgba(35,40,79,.88);color:#fff;font-weight:900;font-size:clamp(.8rem,2.4vw,1.15rem);padding:4px 2px;line-height:1.1}
.luogo .sub{position:absolute;top:4px;left:0;right:0;text-align:center;z-index:3;font-size:clamp(.6rem,1.6vw,.8rem);font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.luogo.bloccato{filter:grayscale(.85) brightness(.85)}
.luogo.bloccato .emj{animation:none}
.luogo .lucchetto{position:absolute;z-index:4;top:6px;right:6px;font-size:1.5rem}
.luogo.nuovo{animation:pulsa 1.2s ease-in-out 3}
@keyframes pulsa{50%{box-shadow:0 0 0 14px rgba(255,203,5,.7),0 8px 0 rgba(0,0,0,.28)}}
.l-bosco{background:linear-gradient(180deg,#8ee27a,#3f9d4b)}
.l-citta{background:linear-gradient(180deg,#9ab8ff,#5b72d6)}
.l-grotta{background:linear-gradient(180deg,#8c7aa8,#3d2f5c)}
.l-spiaggia{background:linear-gradient(180deg,#ffe9a0 0,#ffd27a 55%,#4fc3f7 56%,#1e88e5)}
.l-montagna{background:linear-gradient(180deg,#d6e6f5,#8a9bb0)}
.l-laboratorio{background:linear-gradient(180deg,#fff4a8,#ffb347)}
/* Animazioni d'atmosfera dentro ai luoghi */
.atm{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.atm span{position:absolute;left:var(--x);top:-14%;font-size:var(--s,1.2rem);opacity:.95;animation:cadi var(--t,5s) linear var(--d,0s) infinite}
@keyframes cadi{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx,24px),135px) rotate(300deg)}}
.atm span.brilla{top:var(--y);animation:brilla var(--t,2s) ease-in-out var(--d,0s) infinite}
@keyframes brilla{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1.2);opacity:1}}
.atm span.sale{top:auto;bottom:-10%;animation:sale var(--t,4s) ease-in var(--d,0s) infinite}
@keyframes sale{from{transform:translate(0,0) scale(.5);opacity:.9}to{transform:translate(var(--dx,10px),-130px) scale(1.1);opacity:0}}
.atm span.onda{top:auto;bottom:6%;font-size:2.2rem;left:-10%;animation:onda var(--t,4s) ease-in-out var(--d,0s) infinite alternate}
@keyframes onda{from{transform:translateX(0)}to{transform:translateX(70%)}}
.atm span.scorri{top:var(--y);left:-20%;animation:scorri var(--t,9s) linear var(--d,0s) infinite}
@keyframes scorri{to{transform:translateX(160px)}}
/* Effetti sbloccati sulla mappa */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.fx span{position:absolute;left:var(--x);top:-10%;font-size:var(--s,1.6rem);animation:cadi var(--t,6s) linear var(--d,0s) infinite}
.fx .arcobaleno{left:50%;top:-4%;font-size:min(14vw,7rem);transform:translateX(-50%);animation:none;opacity:.85;z-index:0}
.fx span.palloncino{top:auto;bottom:-12%;animation:sale var(--t,8s) linear var(--d,0s) infinite;font-size:2.2rem}
.fx span.pika{top:auto;bottom:2%;left:-10%;font-size:2.6rem;animation:corri 9s linear infinite}
@keyframes corri{to{transform:translateX(calc(min(100vw,1000px) + 60px))}}
.fx span.fuoco{top:var(--y);animation:brilla var(--t,2s) ease-in-out var(--d,0s) infinite;font-size:2.2rem}

/* =========================================================
   GIOCO (introduzione, minigiochi, risultato)
   ========================================================= */
#gioco{align-items:center}
#gioco .corpo{width:100%;max-width:860px;flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:0}
.intro{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;margin:auto 0}
.intro h3{margin:0;font-size:2rem;font-weight:1000}
.apparso{font-size:1.4rem;font-weight:900;background:#fff;border:4px solid var(--blu);border-radius:999px;padding:8px 22px;animation:rimbalza 1s ease-in-out infinite}
@keyframes rimbalza{50%{transform:scale(1.06)}}
.regole{background:#fff;border:4px dashed var(--blu);border-radius:22px;padding:12px 20px;font-size:1.25rem;font-weight:800;max-width:560px}
.art{position:relative;width:var(--w,260px);aspect-ratio:1.6/1;border-radius:22px;border:5px solid #fff;overflow:hidden;
  background-color:#dfe8ff;background-size:116% auto;background-position:50% 16%;background-repeat:no-repeat;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.art .fb{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:calc(var(--w,260px) * .32);background:var(--tc,#ddd)}
.art.noart .fb{display:flex}
.art.selvatico{animation:selvatico 1.6s ease-in-out infinite}
@keyframes selvatico{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;font-weight:900;font-size:1.2rem}
.msg{min-height:2.2em;font-size:1.5rem;font-weight:1000;text-align:center;display:flex;align-items:center;justify-content:center}
.msg.ok{color:#17883a}.msg.no{color:#c4231c}

/* Memory */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:760px;perspective:900px}
@media (orientation:portrait){.mem-grid{grid-template-columns:repeat(3,1fr);max-width:560px}}
.tessera{position:relative;aspect-ratio:1/1;border:0;padding:0;background:none;transform-style:preserve-3d;transition:transform .45s}
.tessera.girata,.tessera.trovata{transform:rotateY(180deg)}
.tessera .f{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid #fff;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.tessera .dorso{background:radial-gradient(circle at 50% 50%,#fff 0 14%,var(--ink) 15% 20%,transparent 21%),linear-gradient(180deg,var(--rosso) 0 47%,var(--ink) 47% 53%,#fff 53% 100%)}
.tessera .fronte{transform:rotateY(180deg);background:#fff;display:flex;flex-direction:column}
.tessera .fronte .art{--w:100%;width:100%;flex:1;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none;background-size:150% auto;background-position:50% 13%}
.tessera .fronte b{font-size:.8rem;line-height:1.2;padding:2px;text-align:center;background:var(--giallo)}
.tessera.trovata .fronte{box-shadow:inset 0 0 0 5px var(--verde)}
.tessera.trovata{animation:festa .6s .4s}
@keyframes festa{50%{transform:rotateY(180deg) scale(1.1)}}

/* Quiz */
.quiz-q{background:#fff;border:4px solid var(--blu);border-radius:24px;padding:14px 20px;font-size:1.6rem;font-weight:900;text-align:center;width:100%}
.quiz-opz{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
@media (max-width:560px){.quiz-opz{grid-template-columns:1fr}}
.opz{min-height:72px;font-size:1.4rem;font-weight:900;background:#fff;border:4px solid var(--blu);border-radius:22px;box-shadow:0 6px 0 var(--blu-sc);padding:10px;transition:transform .08s}
.opz:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blu-sc)}
.opz.giusta{background:#b6f2c3;border-color:var(--verde-sc);box-shadow:0 6px 0 var(--verde-sc);animation:festa2 .5s}
.opz.sbagliata{background:#ffc9c4;border-color:var(--rosso-sc);box-shadow:0 6px 0 var(--rosso-sc);animation:scuoti .4s}
@keyframes festa2{50%{transform:scale(1.06)}}
@keyframes scuoti{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Lancia la Poké Ball */
.campo{position:relative;width:min(100%,520px);aspect-ratio:1/1;max-height:52dvh;margin:0 auto;display:flex;align-items:center;justify-content:center;
  border-radius:30px;background:radial-gradient(circle,#4a3a6a 0,#2a2040 70%);border:5px solid #fff;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.campo .art{--w:46%;position:relative;z-index:2}
.bersaglio{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;margin:-23% 0 0 -23%;border-radius:50%;border:5px dashed #fff;opacity:.9;z-index:3}
.anello{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;margin:-23% 0 0 -23%;border-radius:50%;border:12px solid #ff5252;z-index:4;will-change:transform;box-shadow:0 0 18px currentColor}
.anello.giallo{border-color:#ffd740}.anello.verde{border-color:#3dff7a}
.lancio{position:absolute;left:50%;bottom:-12%;width:15%;aspect-ratio:1;margin-left:-7.5%;z-index:6;border-radius:50%;border:4px solid var(--ink);
  background:linear-gradient(180deg,var(--rosso) 0 44%,var(--ink) 44% 56%,#fff 56% 100%);opacity:0}
.lancio.vola{animation:vola .55s ease-in forwards}
@keyframes vola{0%{opacity:1;bottom:-12%;transform:scale(1.3) rotate(0)}100%{opacity:1;bottom:46%;transform:scale(.6) rotate(540deg)}}
.big-tocca{width:min(100%,520px);min-height:96px;font-size:2rem}

/* Puzzle */
.puz-wrap{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.puz{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:min(88vw,calc((100dvh - 330px) * .716),440px);aspect-ratio:63/88;background:var(--ink);border:5px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.pezzo{border:0;padding:0;border-radius:0;background-size:300% 300%;background-color:#ddd;position:relative;transition:transform .2s,filter .2s}
.pezzo.sel{transform:scale(.92);outline:5px solid var(--giallo);outline-offset:-5px;z-index:2;filter:brightness(1.15)}
.pezzo.giusto::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px rgba(63,191,90,.9)}
.modello{width:150px;aspect-ratio:63/88;border-radius:10px;border:4px solid #fff;background-size:100% 100%;background-color:#ddd;box-shadow:0 5px 0 rgba(0,0,0,.25)}

/* Simon */
.simon{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(88vw,calc(100dvh - 330px),460px);aspect-ratio:1/1;padding:12px;background:var(--ink);border-radius:50%}
.pad{border:0;min-height:48px;opacity:.55;transition:opacity .08s,transform .08s,filter .08s;border-radius:100% 12px 12px 12px}
.pad:nth-child(2){border-radius:12px 100% 12px 12px}.pad:nth-child(3){border-radius:12px 12px 12px 100%}.pad:nth-child(4){border-radius:12px 12px 100% 12px}
.pad.acceso{opacity:1;transform:scale(1.05);filter:brightness(1.4) drop-shadow(0 0 18px #fff)}
.pad.r{background:#ee1515}.pad.b{background:#2f6bff}.pad.v{background:#25b84a}.pad.g{background:#ffd21f}
.simon-centro{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:6px solid var(--ink);
  display:flex;align-items:center;justify-content:center;text-align:center;font-weight:1000;font-size:1.1rem;line-height:1.05;pointer-events:none}

/* Risultato */
.risultato{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin:auto 0;width:100%}
.stelle{font-size:3rem;letter-spacing:6px}
.stelle i{font-style:normal;display:inline-block;animation:stella .5s both}
.stelle i.spenta{filter:grayscale(1) opacity(.35)}
@keyframes stella{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.pokeball-grande{width:130px;height:130px;border-radius:50%;border:7px solid var(--ink);position:relative;
  background:linear-gradient(180deg,var(--rosso) 0 42%,var(--ink) 42% 58%,#fff 58% 100%);animation:scuotiBall 1.5s ease-in-out}
.pokeball-grande::after{content:"";position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px;border-radius:50%;background:#fff;border:7px solid var(--ink)}
@keyframes scuotiBall{0%{transform:translateY(-120px) rotate(0)}25%{transform:translateY(0) rotate(0)}35%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}65%{transform:rotate(-25deg)}80%{transform:rotate(15deg)}100%{transform:rotate(0)}}
.scappa{font-size:6rem;animation:scappa 1.2s ease-in forwards}
@keyframes scappa{to{transform:translateX(120%) scale(.5);opacity:0}}
.badge-rar{display:inline-block;font-weight:1000;font-size:1.3rem;padding:6px 18px;border-radius:999px;border:3px solid #fff;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.risultato .azioni{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* =========================================================
   CARTE (album + risultato + viewer)
   ========================================================= */
.carta{position:relative;aspect-ratio:63/88;border-radius:7%/5%;background:#ccd3e6;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .15s}
.carta img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.carta.sil{background:linear-gradient(135deg,#aeb4c4,#8d94a8);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.carta.sil b{font-size:2.6rem;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.carta.sil small{font-weight:900;font-size:.95rem;opacity:.9}
.r-comune{--rc:#7bc47f}.r-non-comune{--rc:#4aa3ff}.r-rara{--rc:#ffc400}.r-ultra-rara{--rc:#ff4fd8}

.cella .nome{font-weight:900;font-size:1rem;line-height:1.1}

.chip-tipo{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:99px;color:#fff;font-weight:900;font-size:.8rem;text-shadow:0 1px 1px rgba(0,0,0,.4);background:var(--tc,#999)}
.chip-rar{display:inline-flex;padding:1px 8px;border-radius:99px;color:#fff;font-weight:900;font-size:.8rem;background:var(--rc,#999);text-shadow:0 1px 1px rgba(0,0,0,.4)}
.copie{position:absolute;top:4px;right:4px;z-index:3;background:var(--rosso);color:#fff;font-weight:1000;font-size:.85rem;border-radius:99px;padding:2px 8px;border:2px solid #fff}
.nuova-tag{position:absolute;top:4px;left:4px;z-index:3;background:var(--verde);color:#fff;font-weight:1000;font-size:.8rem;border-radius:99px;padding:2px 8px;border:2px solid #fff}

#album .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;padding:6px 4px 30px}

.chip{flex:0 0 auto;min-height:48px;padding:6px 16px;border-radius:99px;border:3px solid var(--blu);background:#fff;font-weight:900;font-size:1.05rem;white-space:nowrap}
.chip.on{background:var(--blu);color:#fff}
.vuoto{text-align:center;font-weight:900;font-size:1.3rem;padding:40px 10px}

/* =========================================================
   MODALI, VIEWER, TOAST, CONFETTI
   ========================================================= */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(20,25,60,.7);padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.overlay.on{display:flex;animation:entra .25s}
.modale{background:var(--carta);border:6px solid var(--blu);border-radius:30px;padding:22px 24px;max-width:560px;width:100%;max-height:92dvh;overflow-y:auto;text-align:center;box-shadow:0 10px 0 var(--blu-sc);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

.lista-premi{text-align:left;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.premio{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid #cdd3f5;border-radius:18px;padding:8px 12px;font-weight:800;font-size:1.05rem}
.premio.on{border-color:var(--verde);background:#eaffef}
.premio .e{font-size:1.8rem}.premio small{display:block;font-weight:700;opacity:.75}
.riga-imp{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;font-weight:900}

#viewer{flex-direction:column;gap:12px;background:radial-gradient(circle,rgba(40,50,110,.92),rgba(10,12,35,.96))}
.viewer-carta{position:relative;height:min(68dvh,calc(88vw * 1.397),760px);aspect-ratio:63/88;border-radius:5%/3.6%;background:#ccd3e6;overflow:hidden;
  box-shadow:0 0 0 5px var(--rc,#fff),0 0 40px 6px var(--rc,#fff),0 20px 40px rgba(0,0,0,.5);animation:apriCarta .7s cubic-bezier(.2,1.1,.3,1);transition:transform .1s;transform-style:preserve-3d}
.viewer-carta img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes apriCarta{0%{transform:scale(.2) rotateY(180deg);opacity:0}100%{transform:none;opacity:1}}
.viewer-info{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;color:#fff;font-weight:900;font-size:1.2rem;text-align:center}
.viewer-info b{font-size:1.5rem}
.viewer-riga{display:flex;gap:14px;align-items:center;justify-content:center}

#toast{position:fixed;left:50%;bottom:calc(26px + var(--safe-b));transform:translate(-50%,40px);background:var(--ink);color:#fff;font-weight:900;font-size:1.25rem;padding:14px 24px;border-radius:99px;z-index:90;opacity:0;pointer-events:none;transition:all .3s;max-width:92vw;text-align:center;border:4px solid #fff}
#toast.on{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;z-index:80;pointer-events:none;width:100%;height:100%}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* Carta "rappresentativa" di una specie (la più comune), usata per mostrare il Pokémon selvatico */

const attesa = ms => new Promise(r => setTimeout(r, ms));

/* =========================================================
   SALVATAGGIO (localStorage) + ENERGIA GIORNALIERA
   ========================================================= */
let stato;
function statoIniziale() {
  return { v: 1, possedute: {}, energia: USCITE_AL_GIORNO, giorno: oggi(), serieComuni: 0, tutorialFatto: false, suono: true,
           statistiche: { cacce: 0, fughe: 0 }, premiVisti: 0 };
}
/* Data locale (non UTC!) in formato AAAA-MM-GG: l'energia si ricarica a mezzanotte locale */
function oggi() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function carica() {
  try { const s = JSON.parse(localStorage.getItem(CHIAVE_SALVATAGGIO)); if (s && s.v === 1) return Object.assign(statoIniziale(), s); } catch (e) {}
  return statoIniziale();
}
function salva() { try { localStorage.setItem(CHIAVE_SALVATAGGIO, JSON.stringify(stato)); } catch (e) {} }
/* Ricarica l'energia se è cambiato il giorno. Ritorna true se ha ricaricato. */
function controllaGiorno() {
  if (stato.giorno !== oggi()) { stato.giorno = oggi(); stato.energia = USCITE_AL_GIORNO; salva(); aggiornaUI(); return true; }
  return false;
}
const numPossedute = () => Object.keys(stato.possedute).filter(id => CARTA_PER_ID[id]).length;
const possiede = id => !!stato.possedute[id];
function rangoAttuale() { return RANGHI[Math.min(RANGHI.length - 1, Math.floor(numPossedute() / 25))]; }
const luogoSbloccato = id => numPossedute() >= LUOGHI[id].sblocco;

/* =========================================================
   IMMAGINI: URL ufficiali TCGdex + cache offline in IndexedDB
   Le carte possedute (e un'anteprima di ogni Pokémon) vengono salvate sul dispositivo
   così l'album funziona anche senza internet.
   ========================================================= */
const urlRemoto = (c, g = "low") => IMG_BASE + c.i + (g === "high" ? "/high.webp" : "/low.webp");
let _db = null; const _urlMem = new Map();
function apriDB() {
  return _db || (_db = new Promise(res => {
    try { const r = indexedDB.open("pokealbum-immagini", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("img");
      r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
    } catch (e) { res(null); }
  }));
}
async function dbGet(k) { const db = await apriDB(); if (!db) return null; return new Promise(res => { try { const q = db.transaction("img").objectStore("img").get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } }); }
async function dbPut(k, v) { const db = await apriDB(); if (!db) return; return new Promise(res => { try { const t = db.transaction("img", "readwrite"); t.objectStore("img").put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); } catch (e) { res(); } }); }
/* Restituisce l'URL da usare: copia offline se presente, altrimenti l'URL ufficiale */
async function urlImmagine(c, g = "low") {
  const k = c.id + ":" + g;
  if (_urlMem.has(k)) return _urlMem.get(k);
  const blob = await dbGet(k);
  const u = blob ? URL.createObjectURL(blob) : urlRemoto(c, g);
  if (blob) _urlMem.set(k, u);
  return u;
}
async function scaricaImmagine(c, g = "low") {
  const k = c.id + ":" + g;
  if (_urlMem.has(k) || await dbGet(k)) return true;
  if (!navigator.onLine) return false;
  /* Alcuni file del CDN hanno intestazioni CORS doppie e il browser li rifiuta: si provano formati alternativi */
  const base = IMG_BASE + c.i + "/" + g;
  for (const ext of [".webp", ".png", ".jpg"]) {
    try { const r = await fetch(base + ext); if (r.ok) { await dbPut(k, await r.blob()); return true; } } catch (e) {}
  }
  return false;
}
/* Precarica in background: prima le carte possedute, poi un'anteprima per ogni Pokémon */
let _precaricaInCorso = false;
async function precaricaImmagini() {
  if (_precaricaInCorso || !navigator.onLine) return; _precaricaInCorso = true;
  try {
    const lista = [];
    Object.keys(stato.possedute).forEach(id => { const c = CARTA_PER_ID[id]; if (c) { lista.push([c, "low"], [c, "high"]); } });
    for (let d = 1; d <= 151; d++) lista.push([cartaRappresentativa(d), "low"]);
    for (const [c, g] of lista) { if (!navigator.onLine) break; const ok = await scaricaImmagine(c, g); await attesa(ok ? 120 : 400); }
  } finally { _precaricaInCorso = false; }
}
/* Carta segnaposto (SVG) quando l'immagine non è disponibile */
function segnaposto(c) {
  const col = coloreTipo(c.t), nome = (c.n || "").replace(/[<>&]/g, "");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 880"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${col}"/><stop offset="1" stop-color="#fff6c9"/></linearGradient></defs>
  <rect width="630" height="880" rx="40" fill="#ffcb05"/><rect x="28" y="28" width="574" height="824" rx="26" fill="url(#g)"/>
  <circle cx="110" cy="130" r="40" fill="#fff" opacity=".7"/><circle cx="520" cy="740" r="70" fill="#fff" opacity=".4"/>
  <path d="M40 520 L200 360 L330 500 L450 380 L590 520 Z" fill="#fff" opacity=".35"/>
  <text x="315" y="120" font-size="64" font-weight="900" text-anchor="middle" font-family="Arial Rounded MT Bold,Arial,sans-serif" fill="#23284f">${nome}</text>
  <text x="315" y="480" font-size="230" text-anchor="middle">${emojiTipo(c.t)}</text>
  <text x="315" y="640" font-size="120" text-anchor="middle" font-weight="900" fill="#fff" stroke="#23284f" stroke-width="6" paint-order="stroke">?</text>
  <text x="315" y="800" font-size="46" font-weight="800" text-anchor="middle" font-family="Arial,sans-serif" fill="#23284f">Immagine non disponibile</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
/* Imposta l'immagine di un <img>, con fallback al segnaposto */
function impostaImg(img, c, g = "low") {
  img.alt = c.n; let provato = false;
  img.onerror = () => { if (!provato) { provato = true; img.src = segnaposto(c); } };
  urlImmagine(c, g).then(u => { img.src = u; });
}
/* Rende un elemento ".art" con l'illustrazione ritagliata della carta */
function creaArt(d, larghezza = 260, extra = "") {
  const c = cartaRappresentativa(d);
  const el = document.createElement("div");
  el.className = "art " + extra; el.style.setProperty("--w", typeof larghezza === "number" ? larghezza + "px" : larghezza);
  el.style.setProperty("--tc", coloreTipo(c.t));
  el.innerHTML = `<div class="fb">${emojiTipo(c.t)}</div>`;
  urlImmagine(c, "low").then(u => { const t = new Image(); t.onload = () => { el.style.backgroundImage = `url("${u}")`; }; t.onerror = () => el.classList.add("noart"); t.src = u; });
  return el;

/* =========================================================
   AUDIO (Web Audio API, leggero). Si può disattivare dal pulsante 🔊
   ========================================================= */
let _audio = null;
function audio() { if (!_audio) { try { _audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (_audio && _audio.state === "suspended") _audio.resume(); return _audio; }
function nota(freq, dur = .15, tipo = "sine", vol = .12, ritardo = 0) {
  if (!stato.suono) return; const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + ritardo;
  o.type = tipo; o.frequency.value = freq; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
const suoni = {
  tap: () => nota(520, .07, "triangle", .08),
  ok: () => { nota(660, .12, "triangle"); nota(880, .18, "triangle", .12, .1); },
  no: () => { nota(220, .22, "sawtooth", .07); nota(180, .25, "sawtooth", .07, .12); },
  vittoria: () => [523, 659, 784, 1047].forEach((f, i) => nota(f, .22, "triangle", .12, i * .11)),
  rara: () => [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => nota(f, .3, "triangle", .12, i * .09)),
  clic: () => { nota(900, .05, "square", .06); nota(1200, .08, "square", .06, .06); }
};

/* =========================================================
   INTERFACCIA: schermate, toast, modali
   ========================================================= */
function vai(id) {
  $$(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  const sc = $("#" + id); if (sc) sc.scrollTop = 0;
  if (id === "home") aggiornaHome();
  if (id === "mappa") disegnaMappa();
  if (id === "album") disegnaAlbum();
}
let _toastT;
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(_toastT); _toastT = setTimeout(() => t.classList.remove("on"), ms); }
/* Modale generica: ritorna una Promise con il valore del pulsante premuto */
function modale({ titolo = "", html = "", bottoni = [{ testo: "OK", valore: true, classe: "" }], chiudibile = false }) {
  return new Promise(res => {
    const ov = $("#modale");
    ov.innerHTML = `<div class="modale"><h3>${titolo}</h3><div class="mcorpo">${html}</div><div class="bottoni"></div></div>`;
    const box = $(".bottoni", ov);
    bottoni.forEach(b => { const bt = document.createElement("button"); bt.className = "btn " + (b.classe || ""); bt.innerHTML = b.testo;
      bt.onclick = () => { ov.classList.remove("on"); suoni.tap(); res(b.valore); }; box.appendChild(bt); });
    ov.onclick = e => { if (chiudibile && e.target === ov) { ov.classList.remove("on"); res(null); } };
    ov.classList.add("on");

}
function simboliEnergia(el) {
  el.innerHTML = ""; for (let i = 0; i < USCITE_AL_GIORNO; i++) { const b = document.createElement("span"); b.className = "ball" + (i < stato.energia ? "" : " vuota"); el.appendChild(b); }
}
function aggiornaUI() { ["homeEnergia", "mappaEnergia", "giocoEnergia"].forEach(i => simboliEnergia($("#" + i))); aggiornaHome(); $("#btnSuono").textContent = stato.suono ? "🔊" : "🔇"; }
function aggiornaHome() {
  const n = numPossedute(), tot = CARTE.length;
  $("#homeContatore").textContent = `Hai ${n} carte su ${tot}`;
  $("#homeRango").textContent = "🎖️ " + rangoAttuale();
  $("#homeBarra").style.width = (n / tot * 100) + "%";

/* ---------- Tutorial ---------- */
const PASSI_TUTORIAL = [
  { e: "👋", t: "Benvenuto, Allenatore!", p: "Qui colleziona le vere carte Pokémon italiane nel tuo album magico!" },
  { e: "🗺️", t: "Vai a Caccia!", p: "Scegli un luogo sulla mappa. Appare un Pokémon selvatico: per catturarlo devi vincere un gioco o un quiz!" },
  { e: "⭐", t: "Più sei bravo, più è raro!", p: "Un punteggio alto ti porta carte Rare e Ultra rare. Se vai male il Pokémon può scappare… ma puoi riprovare!" },
  { e: "🎯", t: "5 uscite al giorno", p: "Ogni caccia consuma una uscita. A mezzanotte tornano tutte e 5!" },
  { e: "📖", t: "Il tuo Album", p: "Le carte catturate finiscono nell'album. Ogni 25 carte sblocchi nuovi luoghi e sorprese. Buona fortuna!" }

async function mostraTutorial() {
  for (let i = 0; i < PASSI_TUTORIAL.length; i++) {

    const pun = PASSI_TUTORIAL.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("");
    const r = await modale({ titolo: p.t, html: `<div class="grande-emoji">${p.e}</div><p>${p.p}</p><div class="puntini">${pun}</div>`,
      bottoni: [...(i > 0 ? [{ testo: "⬅", valore: "indietro", classe: "blu" }] : []), { testo: ultimo ? "Inizia! 🚀" : "Avanti ➡", valore: "avanti", classe: ultimo ? "verde" : "" }] });

    PREMI.map(p => `<div class="premio ${n >= p.n ? "on" : ""}"><span class="e">${n >= p.n ? p.e : "🔒"}</span><span><b>${p.n} carte</b> — ${p.t}<small>${p.d}</small></span></div>`).join("") + `</div>`;

/* ---------- Impostazioni / area genitori (protetta da una piccola moltiplicazione) ---------- */
async function apriImpostazioni() {
  const a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4);
  const r = await modale({ titolo: "👨‍👩‍👧 Area genitori", html: `<p>Per entrare risolvi: quanto fa <b>${a} × ${b}</b>?</p><input id="rispGen" type="number" inputmode="numeric" style="font-size:1.8rem;width:140px;text-align:center;border:4px solid var(--blu);border-radius:16px;padding:8px;-webkit-user-select:text;user-select:text">`,
    bottoni: [{ testo: "Annulla", valore: false, classe: "blu" }, { testo: "Entra", valore: true }] });
  if (!r) return;
  if (parseInt(($("#rispGen") || {}).value, 10) !== a * b) { toast("Risposta sbagliata 🙂"); return; }
  const scelta = await modale({ titolo: "⚙️ Impostazioni",
    html: `<div class="riga-imp"><span>Suoni: <b>${stato.suono ? "accesi" : "spenti"}</b></span></div><p style="font-size:1rem">Uscite rimaste oggi: <b>${stato.energia}/${USCITE_AL_GIORNO}</b></p>`,
    bottoni: [
      { testo: stato.suono ? "🔇 Spegni suoni" : "🔊 Accendi suoni", valore: "suono", classe: "blu piccolo" },
      { testo: "🔄 Ricarica uscite", valore: "energia", classe: "verde piccolo" },
      { testo: "❓ Rivedi tutorial", valore: "tutorial", classe: "blu piccolo" },
      { testo: "🗑️ Azzera tutto", valore: "reset", classe: "rosso piccolo" },
      { testo: "Chiudi", valore: null, classe: "piccolo" }] });
  if (scelta === "suono") { stato.suono = !stato.suono; salva(); aggiornaUI(); }
  else if (scelta === "energia") { stato.energia = USCITE_AL_GIORNO; salva(); aggiornaUI(); toast("Uscite ricaricate!"); }
  else if (scelta === "tutorial") mostraTutorial();
  else if (scelta === "reset") {
    const ok = await modale({ titolo: "Sei sicuro?", html: "<p>Perderai <b>tutte le carte</b> e i progressi. Non si può annullare!</p>", bottoni: [{ testo: "No, annulla", valore: false, classe: "verde" }, { testo: "Sì, azzera", valore: true, classe: "rosso" }] });
    if (ok) { stato = statoIniziale(); stato.tutorialFatto = true; salva(); aggiornaUI(); toast("Progressi azzerati"); }
  }
}

/* =========================================================
   CONFETTI (canvas) – per carte rare e ultra rare
   ========================================================= */
let _confettiRaf = 0;
function confetti(quanti = 150) {
  const cv = $("#confetti"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ["#ffcb05", "#ee1515", "#3b4cca", "#3fbf5a", "#ff7ad9", "#4fd1ff", "#ff9f1c"];
  const ps = Array.from({ length: quanti }, () => ({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4,
    r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, s: 8 + Math.random() * 10, c: casuale(cols), stella: Math.random() < .25 }));
  const t0 = performance.now(); cancelAnimationFrame(_confettiRaf);
  (function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight); let vivo = false;
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .05; p.r += p.vr; if (p.y < innerHeight + 30) vivo = true;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      if (p.stella) { ctx.font = p.s * 1.8 + "px serif"; ctx.textAlign = "center"; ctx.fillText("⭐", 0, 0); } else { ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
      ctx.restore(); });
    if (vivo && t - t0 < 6000) _confettiRaf = requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* =========================================================

    case "spiaggia": sp("🌊", "onda", { t: "3.6s", d: "0s" }); sp("🌊", "onda", { t: "4.4s", d: "-1.5s", x: "0" }); for (let i = 0; i < 4; i++) sp("○", "sale", { x: r(5, 85) + "%", t: r(3, 5) + "s", d: -r(0, 4) + "s", dx: r(-10, 10) + "px", s: ".9rem" }); break;

   ========================================================= */
let partita = null; // { luogo, dex, inCorso, finito, timers[], raf }

/* Algoritmo di rarità (come da specifica). Il parametro bonusPity aggiunge fortuna dopo molte carte comuni di fila */
function calcolaRarità(punteggio, luogo, bonusPity = 0) {
  let chance = punteggio * 0.55;
  if (luogo === "montagna") chance += 12;
  if (luogo === "laboratorio") chance += 22;
  chance += bonusPity; // pity system
  const r = Math.random() * 100;
  if (r < chance * 0.12) return "ultra-rara";
  if (r < chance * 0.35) return "rara";
  if (r < chance * 0.70) return "non-comune";
  return "comune";
}
/* Pity: dopo 8 comuni consecutivi la probabilità cresce leggermente (max +30) */
const bonusPityAttuale = () => stato.serieComuni >= 8 ? Math.min(10 + (stato.serieComuni - 8) * 3, 30) : 0;

function scegliSpecieSelvatica(id) {
  const pool = LUOGHI[id].pool;
  if (pool) return casuale(pool);
  // Laboratorio: tutti i 151, più probabili evoluzioni finali e leggendari
  const pesi = []; for (let d = 1; d <= 151; d++) { const w = LEGGENDARI.includes(d) ? 4 : (EVO_DA[d] && !EVO_A[d]) ? 3 : 1; for (let k = 0; k < w; k++) pesi.push(d); }
  return casuale(pesi);
}
function scegliCarta(dex, rar, maxRar) {
  const lista = CARTE_SPECIE[dex], idx = RARITA.indexOf(rar), max = RARITA.indexOf(maxRar);
  const ordine = []; for (let k = idx; k >= 0; k--) ordine.push(k); for (let k = idx + 1; k <= max; k++) ordine.push(k);
  let cand = null;
  for (const k of ordine) { const cs = lista.filter(c => c.r === RARITA[k]); if (cs.length) { cand = cs; break; } }
  if (!cand) cand = lista;
  const nuove = cand.filter(c => !possiede(c.id));
  if (nuove.length) return casuale(nuove);
  const altre = lista.filter(c => !possiede(c.id) && RARITA.indexOf(c.r) <= max);
  return altre.length && Math.random() < .7 ? casuale(altre) : casuale(cand);
}

const altri = (escludi, n, pool) => scegliN((pool || Array.from({ length: 151 }, (_, i) => i + 1)).filter(d => !escludi.includes(d)), n).map(_n);
const GEN = {
  nome: () => { const d = casuale(LUOGHI.citta.pool); return dom("Come si chiama questo Pokémon?", _n(d), altri([d], 3), d); },
  tipo: () => { const d = casuale(Object.keys(TIPO_SPECIE).map(Number)), t = TIPO_SPECIE[d]; return dom(`Di che tipo è ${_n(d)}?`, t, scegliN(TIPI_QUIZ.filter(x => x !== t), 3), d); },
  evoA: dura => { const x = casuale(Object.keys(EVO_A).map(Number)); const ev = casuale(EVO_A[x]);
    const pool = dura ? Object.keys(EVO_DA).map(Number) : null;
    return dom(`In cosa si evolve ${_n(x)}?`, _n(ev), altri([x, ...EVO_A[x]], 3, pool), x); },
  evoDa: dura => { const x = casuale(Object.keys(EVO_DA).map(Number)); const pre = EVO_DA[x];
    const pool = dura ? Object.keys(EVO_A).map(Number) : null;
    return dom(`Da quale Pokémon si evolve ${_n(x)}?`, _n(pre), altri([pre, x], 3, pool), x); },
  catena: () => { const cand = Object.keys(EVO_A).map(Number).filter(a => EVO_A[a].length === 1 && EVO_A[EVO_A[a][0]] && EVO_A[EVO_A[a][0]].length === 1);
    const a = casuale(cand), b = EVO_A[a][0], c = EVO_A[b][0];
    return dom(`${_n(a)} → ${_n(b)} → ?`, _n(c), altri([a, b, c], 3, Object.keys(EVO_DA).map(Number)), c); },
  numero: () => { const d = casuale([1, 4, 7, 25, 133, 150, 151, 129, 143, 6, 9, 3, 39, 52, 54, 94, 131, 149]); const sb = new Set();
    while (sb.size < 3) { const v = limita(d + Math.floor((Math.random() - .5) * 40), 1, 151); if (v !== d) sb.add(v); }
    return dom(`Che numero ha ${_n(d)} nel Pokédex?`, "N° " + d, [...sb].map(v => "N° " + v), d); },
  trivia: dura => { const t = casuale(dura ? TRIVIA_DIFFICILI() : TRIVIA_FACILI()); return dom(t.q, t.ok, t.no); }
};
function generaQuiz(n, dura) {
  const ordine = dura ? ["evoA", "evoDa", "catena", "numero", "trivia", "evoA", "trivia", "evoDa"] : ["nome", "tipo", "evoA", "evoDa", "trivia", "nome", "trivia"];
  const out = [], viste = new Set(); let tent = 0, i = 0;
  const gens = mescola(ordine);
  while (out.length < n && tent++ < 200) {
    const q = GEN[gens[i++ % gens.length]](dura);
    if (!viste.has(q.q)) { viste.add(q.q); out.push(q); }
  }
  return out;
}
function giocoQuizGenerico(corpo, fine, N, dura) {
  const domande = generaQuiz(N, dura); let i = 0, giuste = 0, rispondi = true;
  const mostra = () => {
    const q = domande[i]; rispondi = true;
    corpo.innerHTML = `<div class="hud"><span>❓ Domanda <b>${i + 1}</b>/${N}</span><span>✅ Giuste: <b>${giuste}</b></span></div>
      <div id="qArt"></div><div class="quiz-q">${q.q}</div><div class="quiz-opz"></div><div class="msg" id="qMsg"></div><div id="qAvanti"></div>`;
    if (q.art) $("#qArt").appendChild(creaArt(q.art, 190));
    const box = $(".quiz-opz", corpo);
    q.opz.forEach((o, k) => {
      const b = document.createElement("button"); b.className = "opz"; b.textContent = o;
      b.onclick = () => {
        if (!rispondi) return; rispondi = false;
        const ok = k === q.giusta; if (ok) giuste++;
        b.classList.add(ok ? "giusta" : "sbagliata"); if (!ok) $$(".opz", box)[q.giusta].classList.add("giusta");
        ok ? suoni.ok() : suoni.no();
        $("#qMsg").className = "msg " + (ok ? "ok" : "no");
        $("#qMsg").textContent = ok ? casuale(["Esatto! 🎉", "Giusto! ⭐", "Bravissimo! 👏", "Grande Allenatore! 🌟"]) : casuale(["Quasi! Ora lo sai! 💡", "Non è questa… la prossima! 💪"]);
        const av = document.createElement("button"); av.className = "btn grande"; av.textContent = i + 1 === N ? "🏁 Vedi il risultato" : "Avanti ➡";
        av.onclick = () => { suoni.tap(); if (i + 1 === N) fine(giuste / N * 100); else { i++; mostra(); } };
        $("#qAvanti").appendChild(av);
      };
      box.appendChild(b);
    });
  };
  mostra();
}
const giocoQuiz = (c, f) => giocoQuizGenerico(c, f, 5, false);
const giocoQuizHard = (c, f) => giocoQuizGenerico(c, f, 7, true);

/* =========================================================
   MINI-GIOCO 4: LANCIA LA POKÉ BALL (Grotta) – timing
   ========================================================= */
function giocoPalla(corpo, fine) {
  const P = partita, LANCI = 5, PERIODI = [2.6, 2.3, 2.0, 1.7, 1.45];
  let n = 0, punti = [], attivo = false, t0 = 0;
  corpo.innerHTML = `<div class="hud"><span>⚾ Lancio <b id="pLancio">1</b>/${LANCI}</span><span>⭐ Punti: <b id="pTot">0</b></span></div>
    <div class="campo" id="campo"><div class="bersaglio"></div><div class="anello" id="anello"></div><div class="lancio" id="ballaL"></div></div>
    <div class="msg" id="pMsg"></div><button class="btn rosso big-tocca" id="btnLancia">⚾ LANCIA!</button>`;
  const campo = $("#campo"), anello = $("#anello"), ball = $("#ballaL");
  campo.insertBefore(creaArt(P.dex, "46%", "selvatico"), campo.firstChild);
  const scala = () => { const T = PERIODI[n] * 1000, ph = ((performance.now() - t0) / T) % 1, tri = ph < .5 ? ph * 2 : 2 - ph * 2; return 2.2 - tri * 1.7; };
  const colore = s => { const d = Math.abs(s - 1); return d < .14 ? "verde" : d < .32 ? "giallo" : ""; };
  function frame() {
    if (!attivo) return;
    const s = scala(); anello.style.transform = `scale(${s})`; anello.className = "anello " + colore(s);
    P.raf = requestAnimationFrame(frame);
  }
  function inizia() {
    ball.classList.remove("vola"); void ball.offsetWidth; $("#pMsg").textContent = "Aspetta il verde…"; $("#pMsg").className = "msg";
    t0 = performance.now() - Math.random() * PERIODI[n] * 400; attivo = true; frame();
  }
  function lancia() {
    if (!attivo || P.finito) return; attivo = false; cancelAnimationFrame(P.raf);
    const s = scala(), d = Math.abs(s - 1);
    const pt = d < .06 ? 100 : Math.max(0, Math.round(100 - (d - .06) * 250)); punti.push(pt);
    anello.style.transform = `scale(${s})`; ball.classList.add("vola"); suoni.tap();
    const tot = punti.reduce((a, b) => a + b, 0);
    ritardo(() => {
      $("#pTot").textContent = Math.round(tot / punti.length);
      const m = $("#pMsg"); m.className = "msg " + (pt >= 60 ? "ok" : "no");
      m.textContent = pt >= 90 ? "PERFETTO! 🎯" : pt >= 60 ? "Ottimo! 👏" : pt >= 30 ? "Buono! 🙂" : (s > 1 ? "Troppo presto! 😅" : "Troppo tardi! 😅");
      pt >= 60 ? suoni.ok() : suoni.no();
    }, 450);
    ritardo(() => { n++; if (n >= LANCI) fine(punti.reduce((a, b) => a + b, 0) / LANCI); else { $("#pLancio").textContent = n + 1; inizia(); } }, 1500);
  }
  $("#btnLancia").addEventListener("pointerdown", e => { e.preventDefault(); lancia(); });
  campo.addEventListener("pointerdown", e => { e.preventDefault(); lancia(); });
  ritardo(inizia, 600);
}

/* =========================================================
   MINI-GIOCO 5: PUZZLE (Spiaggia) – scambia i pezzi
   ========================================================= */
function giocoPuzzle(corpo, fine) {
  const P = partita, N = 9, carta = cartaRappresentativa(P.dex);
  // Numero minimo di scambi = N - numero di cicli della permutazione
  const minScambi = ord => { const vis = new Array(N).fill(false); let cicli = 0; for (let i = 0; i < N; i++) { if (vis[i]) continue; cicli++; let j = i; while (!vis[j]) { vis[j] = true; j = ord[j]; } } return N - cicli; };
  let ord; do { ord = mescola([...Array(N).keys()]); } while (minScambi(ord) < 5);
  const minimo = minScambi(ord); let mosse = 0, sel = -1, bloccato = false, img = "";
  corpo.innerHTML = `<div class="hud"><span>🔁 Scambi: <b id="zMosse">0</b></span><span>🎯 Minimo possibile: ${minimo}</span></div><div class="msg" id="zMsg">Tocca due pezzi per scambiarli!</div>
    <div class="puz-wrap"><div class="puz" id="puz"></div><div class="modello" id="modello" title="Modello"></div></div>`;
  const puz = $("#puz"), pezzi = [];
  function disegna() {
    pezzi.forEach((b, pos) => {
      const id = ord[pos], col = id % 3, riga = Math.floor(id / 3);
      b.style.backgroundImage = img ? `url("${img}")` : ""; b.style.backgroundPosition = `${col * 50}% ${riga * 50}%`;
      b.classList.toggle("sel", pos === sel); b.classList.toggle("giusto", id === pos);
    });
  }
  for (let pos = 0; pos < N; pos++) {
    const b = document.createElement("button"); b.className = "pezzo"; b.setAttribute("aria-label", "Pezzo " + (pos + 1));
    b.onclick = () => {
      if (bloccato) return; suoni.tap();
      if (sel < 0) sel = pos; else if (sel === pos) sel = -1;
      else { [ord[sel], ord[pos]] = [ord[pos], ord[sel]]; sel = -1; mosse++; $("#zMosse").textContent = mosse;
        if (ord.every((v, i) => v === i)) { bloccato = true; disegna(); suoni.ok(); $("#zMsg").textContent = "Completato! 🎉"; $("#zMsg").className = "msg ok"; fine(Math.max(20, 100 - (mosse - minimo) * 8)); return; } }
      disegna();
    };
    puz.appendChild(b); pezzi.push(b);
  }
  urlImmagine(carta, "low").then(u => { const t = new Image(); t.onload = () => { img = u; $("#modello").style.backgroundImage = `url("${u}")`; disegna(); };
    t.onerror = () => { img = segnaposto(carta); $("#modello").style.backgroundImage = `url("${img}")`; disegna(); }; t.src = u; });
  disegna();
}

/* =========================================================
   MINI-GIOCO 6: SIMON (Montagna)
   ========================================================= */
function giocoSimon(corpo, fine) {
  const P = partita, COL = ["r", "b", "v", "g"], FREQ = [261, 329, 392, 523], ROUND = 7;
  let vite = 2, round = 0, seq = [], input = null;
  corpo.innerHTML = `<div class="hud"><span>🎵 Round <b id="sRound">1</b>/${ROUND}</span><span id="sVite">❤️❤️</span></div><div class="msg" id="sMsg">Guarda bene!</div>
    <div class="simon" id="simon">${COL.map((c, i) => `<button class="pad ${c}" data-i="${i}" aria-label="Colore ${i + 1}"></button>`).join("")}<div class="simon-centro" id="sCentro">👀</div></div>`;
  const pad = $$(".pad", corpo), msg = t => { $("#sMsg").textContent = t; };
  const vivo = () => partita === P && !P.finito;
  const suona = async (i, dur) => { pad[i].classList.add("acceso"); nota(FREQ[i], dur / 1000, "triangle", .16); await attesa(dur); pad[i].classList.remove("acceso"); };
  pad.forEach((p, i) => p.addEventListener("pointerdown", e => { e.preventDefault(); if (!input) return; suona(i, 180); input(i); }));
  (async function ciclo() {
    await attesa(700);
    while (vivo()) {
      if (seq.length === round) seq.push(Math.floor(Math.random() * 4));
      $("#sRound").textContent = round + 1; $("#sCentro").textContent = "👀"; msg("Guarda bene!"); $("#sMsg").className = "msg";
      await attesa(500); const dur = Math.max(260, 520 - round * 40);
      for (const i of seq) { if (!vivo()) return; await suona(i, dur); await attesa(170); }
      if (!vivo()) return; $("#sCentro").textContent = "👆"; msg("Tocca a te!");
      const ok = await new Promise(res => { let k = 0; input = i => { if (!vivo()) return res(false); if (i !== seq[k]) { input = null; res(false); } else if (++k === seq.length) { input = null; res(true); } }; });
      input = null; if (!vivo()) return;
      if (ok) {
        round++; suoni.ok(); $("#sMsg").className = "msg ok"; msg(casuale(["Giusto! 🎉", "Che orecchio! 👂", "Bravo! ⭐"]));
        if (round >= ROUND) { fine(100); return; }
      } else {
        vite--; suoni.no(); $("#sVite").textContent = "❤️".repeat(vite) + "🖤".repeat(2 - vite); $("#sMsg").className = "msg no";
        if (vite <= 0) { msg("Peccato! 😢"); fine(round / ROUND * 100); return; }
        msg("Ops! Riprova! 💪");
      }
      await attesa(1100);
    }
  })();
}
